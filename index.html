<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Woong Office</title>
  <!-- Import Styles -->
  <link rel="stylesheet" href="./assets/styles.css" />
  <!-- Import Vue.js -->
  <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>

<body>
  <div id="app">
    <section class="hero is-primary">
      <div class="hero-body">
        <div class="container">
          <h1 class="title">Woong Office</h1>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="columns is-multiline is-centered">
          <div class="column is-3">
            <office-card name="Food" image="./assets/images/calendar.png" @click="navigateTo('food')"></office-card>
          </div>
          <div class="column is-3">
            <office-card name="Documents" image="./assets/images/documents.png"
              @click="navigateTo('todo')"></office-card>
          </div>
          <div class="column is-3">
            <office-card name="Mail" image="./assets/images/mail.png" @click="navigateTo('compliment')"></office-card>
          </div>
          <div class="column is-3">
            <office-card name="Photos" image="./assets/images/photos.png" @click="navigateTo('calendar')"></office-card>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Import App -->
  <script src="./main.js"></script>

  <!-- Import Components -->
  <script src="./components/OfficeCard.js"></script>

  <!-- Mount App -->
  <script>
    const mountedApp = app.mount('#app')
  </script>

  <!-- Rout pages-->
  <script>
    app.config.globalProperties.navigateTo = function (destination) {
      switch (destination) {
        case 'food':
          window.location.href = './food.html';
          break;
        case 'todo':
          window.location.href = './todo.html';
          break;
        case 'compliment':
          window.location.href = './compliment.html';
          break;
        case 'calendar':
          window.location.href = './calendar.html';
          break;
        default:
          console.log('Unknown destination');
      }
    };
  </script>
</body>

</html>
