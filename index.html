<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Woong Office</title>
  <!-- Import Styles -->
  <link rel="stylesheet" href="./assets/styles.css" />
  <!-- Import Vue.js -->
  <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <div class="header">
      <h1>Woong Office</h1>
    </div>
    <div class="office-card-container">
      <office-card name="Food" image="./assets/images/calendar.png" @click="navigateTo('food')"></office-card>
      <office-card name="Documents" image="./assets/images/documents.png" @click="navigateTo('todo')"></office-card>
      <office-card name="Mail" image="./assets/images/mail.png" @click="navigateTo('compliment')"></office-card>
      <office-card name="Photos" image="./assets/images/photos.png" @click="navigateTo('photos')"></office-card>
    </div>
  </div>

  <!-- Import App -->
  <script src="./main.js"></script>

  <!-- Import Components -->
  <script src="./components/OfficeCard.js"></script>

  <!-- Mount App -->
  <script>
    const mountedApp = app.mount('#app')
  </script>

  <!-- Rout pages-->
  <script>
    app.config.globalProperties.navigateTo = function (destination) {
      switch (destination) {
        case 'food':
          window.location.href = './food.html';
          break;
        case 'todo':
          window.location.href = './todo.html';
          break;
        case 'compliment':
          window.location.href = './compliment.html';
          break;
        case 'calendar':
          window.location.href = './calendar.html';
          break;
        default:
          console.log('Unknown destination');
      }
    };

  </script>
</body>

</html>
