<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Woong Office</title>
  <!-- Import Vue.js -->
  <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
  <!-- Import Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Import Custom Styles -->
  <link rel="stylesheet" href="./assets/styles.css" />
</head>

<body class="has-background-light">
  <div id="app" class="container is-max-desktop px-4 py-4">
    <div class="has-text-centered mb-4">
      <h1 class="title is-2">Woong Office</h1>
    </div>
    <div class="columns is-mobile is-multiline is-centered" style="max-width: 600px; margin: 0 auto;">
      <div class="column is-half-mobile is-one-third-tablet">
        <office-card name="Food" image="./assets/images/calendar.png" @click="navigateTo('food')"></office-card>
      </div>
      <div class="column is-half-mobile is-one-third-tablet">
        <office-card name="Documents" image="./assets/images/documents.png" @click="navigateTo('todo')"></office-card>
      </div>
      <div class="column is-half-mobile is-one-third-tablet">
        <office-card name="Mail" image="./assets/images/mail.png" @click="navigateTo('compliment')"></office-card>
      </div>
      <div class="column is-half-mobile is-one-third-tablet">
        <office-card name="Photos" image="./assets/images/photos.png" @click="navigateTo('calendar')"></office-card>
      </div>
    </div>
  </div>

  <!-- Import App -->
  <script src="./main.js"></script>

  <!-- Import Components -->
  <script src="./components/OfficeCard.js"></script>

  <!-- Mount App -->
  <script>
    const mountedApp = app.mount('#app')
  </script>

  <!-- Rout pages-->
  <script>
    app.config.globalProperties.navigateTo = function (destination) {
      switch (destination) {
        case 'food':
          window.location.href = './food.html';
          break;
        case 'todo':
          window.location.href = './todo.html';
          break;
        case 'compliment':
          window.location.href = './compliment.html';
          break;
        case 'calendar':
          window.location.href = './calendar.html';
          break;
        default:
          console.log('Unknown destination');
      }
    };
  </script>
</body>

</html>
