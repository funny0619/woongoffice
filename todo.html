<html>

<head>
    <title>Woong Office</title>
    <link rel="icon" href="./assets/images/favicon.ico">

    <link rel="stylesheet" href="./assets/styles.css">
    <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>

<body>
    <div id="app">
        <nav-bar title="으악 오늘 뭐할지 까먹지 말자!"></nav-bar>
        <div class="todo-container">
            <div class="todo-input">
                <input type="text" placeholder="뭐 해야 할까? 적어보자! 💭" id="taskInput">
                <button @click="addTask" id="addTaskButton">추가얌 💕</button>
            </div>

            <div class="filter-buttons">
                <button class="active" id="allButton">해야 할 일</button>
                <button id="activeButton">진행 중~</button>
                <button id="completedButton">다 한 일</button>
            </div>
            <ul class="todo-list">
            </ul>
        </div>
    </div>

    <!-- Import App -->
    <script src="./main.js"></script>
    <script src="./assets/js/todo.js"></script>
    <!-- Import Components -->
    <script src="./components/NavBar.js"></script>
    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
