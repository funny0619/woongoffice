<html>

<head>
    <title>Todo</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>

<body>
    <div id="app">
        <nav-bar title="으악 오늘 뭐할지 까먹지 말자!"></nav-bar>
        <div class="todo-container">
            <div class="todo-input">
                <input type="text" v-model="newTask" @keyup.enter="addTask" placeholder="Add a new task...">
                <button @click="addTask">Add Task</button>
            </div>

            <div class="filter-buttons">
                <button :class="{ active: filter === 'all' }" @click="setFilter('all')">All</button>
                <button :class="{ active: filter === 'active' }" @click="setFilter('active')">Active</button>
                <button :class="{ active: filter === 'completed' }" @click="setFilter('completed')">Completed</button>
            </div>

            <ul class="todo-list">
                <li v-for="task in filteredTasks" :key="task.id" :class="{ completed: task.completed }">
                    <div class="task-content">
                        <input type="checkbox" :checked="task.completed" @change="toggleTask(task)">
                        <span>{{ task.text }}</span>
                    </div>
                    <button class="delete-btn" @click="deleteTask(task.id)">×</button>
                </li>
            </ul>
        </div>
    </div>

    <!-- Import App -->
    <script src="./main.js"></script>
    <!-- Import Components -->
    <script src="./components/NavBar.js"></script>
    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
